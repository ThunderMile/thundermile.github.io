<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6ed">
  <meta name="description" content="Mile Huang’s player card and shared activity. Senior at UW–Madison studying Computer Science and Data Science.">
  <title>Mile Huang | Home</title><link rel="icon" href="assets/mark.png">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/character.js" defer></script><script type="module" src="assets/activity.mjs"></script>
</head><body id="top">
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead"><div class="wrap header-row">
    <a class="brand" href="index.html"><span class="monogram" aria-hidden="true">mh.</span> Mile Huang</a>
    <nav aria-label="Main navigation"><a aria-current="page" href="index.html">Home</a><a href="experience/">Experience</a></nav>
  </div></header>
  <main id="main" class="wrap home-main">
    <div class="player-grid">
      <section class="profile-card" aria-labelledby="name">
        <div class="card-strip"><span class="pixel-dot" aria-hidden="true"></span>Player card<span class="strip-rule" aria-hidden="true"></span></div>
        <div class="portrait-mat"><img src="assets/media/mile-portrait.webp" alt="Mile sitting on a bench in an art gallery." width="839" height="893"></div>
        <div class="profile-info"><h1 id="name">Mile Huang</h1><p class="year">Senior, UW–Madison</p>
          <p>Computer Science · Data Science</p><p>Game Dev · Art</p></div>
      </section>
      <section class="activity-card" aria-labelledby="now-title">
        <div class="activity-header"><h2 id="now-title">What I’m up to</h2>
          <button id="motion" type="button" hidden aria-label="Pause animation" title="Pause animation"><span aria-hidden="true">Ⅱ</span></button>
        </div>
        <div class="scene-frame"><canvas id="character" width="144" height="80" aria-hidden="true"></canvas></div>
        <div class="readout"><span class="status-lamp" aria-hidden="true"></span>
          <div><div class="activity-title"><p class="activity-label" id="activity-label" aria-live="polite">Idle</p><span id="game-icon" aria-hidden="true" hidden></span></div>
            <p id="workout-timer" class="substatus" role="timer" hidden></p>
            <p id="heart" class="substatus" hidden></p>
          </div>
        </div>
        <div id="music" class="music-line" hidden><span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="track"></span></div>
        <div class="console-base" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </section>
    </div>
    <details id="preview" hidden><summary>Local animation preview</summary>
      <div class="preview-inputs"><label>Activity <select id="preview-activity">
        <option value="">Follow shared status</option><option value="idle">Idle</option>
        <option value="class">Scheduled class</option><option value="running">Running</option>
        <option value="swimming">Swimming</option><option value="strength">Strength training</option>
        <option value="jump_rope">Jumping rope</option><option value="badminton">Badminton</option>
        <option value="gaming">Gaming</option><option value="video">Video app</option><option value="bedtime">Bedtime</option>
      </select></label><label><input id="preview-music" type="checkbox"> Preview music</label></div>
      <p>These controls change this tab only.</p>
    </details>
  </main>
  <footer><div class="wrap footer-row"><span>Mile Huang</span><a href="https://github.com/ThunderMile">GitHub</a></div></footer></body></html>
